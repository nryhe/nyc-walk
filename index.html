<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>NYC walk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --sign: #000; --ink: #fff; --muted: #a7a9ac; --dim: #3a3a3a; --signal: #ee352e; --go: #00933c; --you: #0a84ff;
    --panel: rgba(0,0,0,.8);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sign: #000; --ink: #fff; } }
  :root[data-theme="dark"] { --sign: #000; --ink: #fff; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sign); color: var(--ink); overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; }
  .btn { font-weight: 700; font-size: 1.05rem; border: 0; border-radius: 999px; padding: 14px 22px; cursor: pointer; background: var(--ink); color: var(--sign); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn .ico { width: 20px; height: 20px; flex: none; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 0; cursor: pointer; font-size: .98rem; }
  .btn:focus-visible, .link:focus-visible, input:focus-visible, .chip:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }

  /* Map: full screen behind everything, or a minimap over the camera */
  #map { position: fixed; inset: 0; z-index: 0; background: #E3E4E6; }
  #map.mini { inset: auto; right: 12px; bottom: calc(env(safe-area-inset-bottom,0px) + 92px);
    width: min(38vw, 170px); height: min(38vw, 170px); border-radius: 14px; box-shadow: 0 0 0 2px var(--ink); z-index: 30; overflow: hidden; }
  #map.mini .maplibregl-control-container { display: none; }
  .maplibregl-map { font-family: inherit; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: 0; }
  .you { width: 18px; height: 18px; border-radius: 50%; background: var(--you); box-shadow: 0 0 0 3px #fff; }
  .shot { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 50%; background: #fff; color: #000; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 0 0 3px var(--signal); font-size: 15px; }

  /* Top bar */
  #top { position: fixed; left: 0; right: 0; top: 0; z-index: 20; pointer-events: none;
    padding: calc(env(safe-area-inset-top,0px) + 10px) 12px 0; display: none; }
  #top.on { display: block; }
  #locNote { display: none; width: fit-content; max-width: min(92vw, 520px); margin: 8px auto 0; background: var(--sign); color: var(--ink);
    border-radius: 14px; padding: 8px 14px; font-size: .92rem; line-height: 1.35; text-align: center; box-shadow: 0 0 0 2px var(--dim); }
  .topRow { display: flex; gap: 10px; align-items: stretch; max-width: 560px; margin: 0 auto; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; background: var(--panel); padding: 8px; border-radius: 14px; }
  .slot { aspect-ratio: 3 / 4; border-radius: 6px; background: #111; box-shadow: inset 0 0 0 2px var(--dim);
    display: grid; place-items: center; font-weight: 700; font-size: clamp(1.1rem, 5.5vw, 1.8rem); }
  .slot.filled { background: var(--ink); color: var(--sign); box-shadow: none; }
  .slot.next { box-shadow: inset 0 0 0 2px var(--signal); }
  .slot.pop { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .stats { background: var(--panel); border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; min-width: 88px; }
  .stats b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }

  /* Bottom sheet */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none; }
  #sheet.on { display: block; }
  .sheetIn { max-width: 560px; margin: 0 auto; background: var(--sign); border-radius: 20px 20px 0 0;
    padding: 14px 22px calc(env(safe-area-inset-bottom,0px) + 18px); max-height: 62vh; overflow-y: auto; }
  .handle { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .kicker { color: var(--muted); font-size: .95rem; margin: 0; }
  .rule { height: 3px; background: var(--ink); margin-bottom: 12px; }
  h1 { font-size: clamp(1.9rem, 8vw, 2.8rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.04; margin: 0 0 12px; }
  .clue { font-size: 1.15rem; line-height: 1.5; margin: 0 0 14px; max-width: 38ch; }
  .note { color: var(--muted); font-size: .98rem; line-height: 1.45; margin: 0 0 12px; max-width: 40ch; }
  .hint { border-left: 3px solid var(--signal); padding: 4px 0 4px 12px; margin: 0 0 14px; line-height: 1.45; display: none; max-width: 38ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }
  .actions .btn { width: 100%; margin-bottom: 6px; }
  .answerRow { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; margin-bottom: 6px; }
  .answerRow input { font: inherit; font-size: 1.15rem; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--dim);
    background: #111; color: var(--ink); flex: 1; min-width: 8em; }
  .msg { min-height: 1.2em; font-size: .95rem; color: #ff8a84; margin: 6px 0 0; }
  .past { margin-top: 14px; border-top: 1px solid var(--dim); padding-top: 10px; }
  .past summary { cursor: pointer; color: var(--muted); }
  .past ol { padding-left: 0; list-style: none; margin: 10px 0 0; }
  .past li { display: flex; gap: 12px; margin-bottom: 12px; line-height: 1.4; color: #ddd; }
  .past li b { flex: none; min-width: 28px; padding: 0 6px; height: 34px; border-radius: 6px; background: var(--ink); color: var(--sign); display: grid; place-items: center; }
  .collapsed .body { display: none; }
  .row { display: flex; gap: 22px; margin: 4px 0 14px; }
  .row div b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .row div span { color: var(--muted); font-size: .9rem; }
  #center { position: fixed; z-index: 19; right: 14px; display: none; }
  #center.on { display: block; }
  .chip { background: var(--sign); color: var(--ink); border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 700; box-shadow: 0 0 0 2px var(--dim); cursor: pointer; }

  /* Camera and result */
  .screen { position: fixed; inset: 0; display: none; z-index: 10; background: #000; }
  .screen.on { display: block; }
  video, #live, #shot { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; }
  #live { pointer-events: none; }
  #guide { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(90vw, 620px); z-index: 1;
    pointer-events: none; opacity: .75; transition: opacity .3s; }
  #guide svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
  #guide.off { opacity: 0; }
  #snap { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; transform-origin: 0 0; display: none;
    filter: drop-shadow(0 0 2px rgba(0,0,0,.85)); }
  #snap svg { display: block; overflow: visible; }
  #guideTip { position: absolute; left: 50%; transform: translateX(-50%); z-index: 1; white-space: nowrap;
    background: var(--panel); padding: 6px 12px; border-radius: 12px; font-size: .9rem; pointer-events: none; transition: opacity .3s; }
  #shot { object-fit: contain; }
  #camClue { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top,0px) + 12px); z-index: 2;
    background: var(--panel); border-radius: 14px; padding: 10px 14px; line-height: 1.4; font-size: .98rem; border: 0; color: var(--ink); text-align: left; cursor: pointer; width: auto; }
  #camClue small { display: block; color: var(--muted); margin-bottom: 4px; font-size: .85rem; }
  #camClue.short span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pill { position: absolute; left: 12px; bottom: calc(env(safe-area-inset-bottom,0px) + 92px); z-index: 2;
    background: var(--panel); padding: 10px 14px; border-radius: 18px; font-size: .95rem; max-width: calc(100% - 200px);
    display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: 14px 14px calc(env(safe-area-inset-bottom,0px) + 14px); background: var(--panel); }
  #badge { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top,0px) + 16px);
    background: var(--panel); padding: 10px 16px; border-radius: 18px; display: flex; align-items: center; gap: 10px; z-index: 2; }
  #badge.found { background: var(--go); font-weight: 700; padding-left: 10px; }
  #badge svg { width: 28px; height: 28px; flex: none; }
  @media (prefers-reduced-motion: reduce) { .dot, .slot.pop { animation: none; } }
</style>
</head>
<body>

<div id="map" role="region" aria-label="Map of your route"></div>

<div id="top">
  <div class="topRow">
    <div class="board" id="board" aria-label="Your collected pieces"></div>
    <div class="stats" aria-live="off"><b id="clock">0:00</b><span id="dist">0.0 mi</span></div>
  </div>
  <div id="locNote" role="status" aria-live="polite"></div>
</div>

<button id="center" class="chip">Center on me</button>

<div id="sheet"><div class="sheetIn" id="sheetIn"></div></div>

<section id="cam" class="screen" aria-label="Camera">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="live"></canvas>
  <div id="guide" aria-hidden="true"></div>
  <div id="snap" aria-hidden="true"></div>
  <div id="guideTip">Line it up with the outline</div>
  <button id="camClue" class="short" aria-label="Current clue, tap to expand"><small id="camStop"></small><span id="camText"></span></button>
  <div class="pill" aria-live="polite"><span class="dot"></span><span id="status">Looking for it</span></div>
  <div class="bar">
    <button class="btn ghost" id="back">Back</button>
    <button class="btn" id="retry" style="display:none">Retry</button>
    <button class="btn ghost" id="guideBtn">Hide guide</button>
  </div>
</section>

<section id="result" class="screen" aria-label="Your photo">
  <img id="shot" alt="Your photo">
  <div id="badge"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#fff"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#00933c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="badgeText">Found it</span></div>
  <div class="bar">
    <button class="btn ghost" id="retake">Retake</button>
    <button class="btn" id="next"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Next clue</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Saved progress (stays on this phone) ----------
   i: current stop, found: characters, startedAt/finishedAt: timer,
   path: [lat, lng, time] walking track, shots: where each stop was solved */
let state = { i: 0, found: [], startedAt: null, finishedAt: null, path: [], shots: [] };
function load() {
  try {
    if (new URLSearchParams(location.search).get("reset") === "1") { localStorage.removeItem(HUNT.key); history.replaceState(null, "", location.pathname); }
    const s = JSON.parse(localStorage.getItem(HUNT.key) || "null");
    if (s && Number.isInteger(s.i)) state = Object.assign(state, s);

/* ---------- Reference photos ---------- */

/* ---------- Camera ---------- */
const video = $("video"), live = $("live"), lctx = live.getContext("2d");

let stream = null, running = false, stable = 0, lastFound = null, timer = null;

$("camClue").addEventListener("click", () => $("camClue").classList.toggle("short"));
let guideOn = true;
function placeGuideTip() {
  requestAnimationFrame(() => {
    const g = $("guide").getBoundingClientRect();

}

window.addEventListener("resize", placeGuideTip);

  } catch (e) {

  $("camText").textContent = s.clue;

}

async function startDetection() {
  const s = HUNT.stops[state.i];

  try { await loadCv(); await prepareRef(s); }
  catch (e) {

}
$("retry").addEventListener("click", () => { $("retry").style.display = "none"; startDetection(); });
$("back").addEventListener("click", () => render());

}
function stopLoop() { running = false; clearTimeout(timer); }

    ctx.lineWidth = Math.max(3, (parseFloat(cs.strokeWidth) || 3) * scale);
    ctx.beginPath();
    pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
    if (/^(rect|circle|ellipse)$/i.test(el.tagName)) ctx.closePath();
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4;
    ctx.stroke();
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  return true;
}

function detect(s, canvas) {
  const mats = [], keep = (m) => (mats.push(m), m);
  try {
    const src = keep(cv.imread(canvas)), gray = keep(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const kp = keep(new cv.KeyPointVector()), des = keep(new cv.Mat()), none = keep(new cv.Mat());
    orb.detectAndCompute(gray, none, kp, des);
    if (des.rows < MIN_INLIERS) return null;
    const knn = keep(new cv.DMatchVectorVector());
    matcher.knnMatch(s._des, des, knn, 2);
    const a = [], b = [];
    for (let k = 0; k < knn.size(); k++) {
      const pair = knn.get(k);
      if (pair.size() >= 2) {
        const m1 = pair.get(0), m2 = pair.get(1);
        if (m1.distance < 0.75 * m2.distance) { const q = m1.queryIdx * 2, fp = kp.get(m1.trainIdx).pt; a.push(s._pts[q], s._pts[q + 1]); b.push(fp.x, fp.y); }
      }
      pair.delete();
    }
    if (a.length / 2 < MIN_INLIERS) return null;
    const sp = keep(cv.matFromArray(a.length / 2, 1, cv.CV_32FC2, a)), dp = keep(cv.matFromArray(b.length / 2, 1, cv.CV_32FC2, b));
    const mask = keep(new cv.Mat()), H = keep(cv.findHomography(sp, dp, cv.RANSAC, 5, mask));
    if (H.empty() || cv.countNonZero(mask) < MIN_INLIERS) return null;
    const w = s._w, h = s._h, c = s.circle;
    const inM = keep(cv.matFromArray(6, 1, cv.CV_32FC2, [0, 0, w, 0, w, h, 0, h, c.x, c.y, c.x + c.r, c.y])), outM = keep(new cv.Mat());
    cv.perspectiveTransform(inM, outM, H);
    const o = outM.data32F, P = (k) => ({ x: o[k * 2], y: o[k * 2 + 1] });
    const quad = [P(0), P(1), P(2), P(3)], center = P(4), edge = P(5);
    if (!isConvex(quad) || polyArea(quad) < canvas.width * canvas.height * 0.01) return null;
    const radius = Math.hypot(edge.x - center.x, edge.y - center.y);
    if (s.color && !colorOk(s.color, center, radius, canvas)) return null;
    return { quad, center, radius, hm: Array.from(H.data64F) };
  } finally { mats.forEach(m => { try { m.delete(); } catch (e) {} }); }
}

function colorOk(fn, center, radius, canvas) {
  let ok = 0;
  for (let k = 0; k < 8; k++) {
    const ang = k * Math.PI / 4, x = Math.round(center.x + radius * .75 * Math.cos(ang)), y = Math.round(center.y + radius * .75 * Math.sin(ang));
    if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) continue;
    const q = pctx.getImageData(x, y, 1, 1).data;
    if (fn(q[0], q[1], q[2])) ok++;
  }
  return ok >= 4;
}
function isConvex(q) {
  let sign = 0;
  for (let k = 0; k < 4; k++) {
    const a = q[k], b = q[(k + 1) % 4], c = q[(k + 2) % 4];
    const z = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
    if (z === 0) return false;
    if (!sign) sign = Math.sign(z); else if (Math.sign(z) !== sign) return false;
  }
  return true;
}
function polyArea(q) { let s = 0; for (let k = 0; k < 4; k++) { const a = q[k], b = q[(k + 1) % 4]; s += a.x * b.y - b.x * a.y; } return Math.abs(s) / 2; }


/* ---------- Capture ---------- */
let foundThisPhoto = false;
function capture(found) {
  stopLoop();
  const vw = video.videoWidth, vh = video.videoHeight;
  const out = document.createElement("canvas"); out.width = vw; out.height = vh;
  const o = out.getContext("2d"); o.drawImage(video, 0, 0, vw, vh);
  if (found && lastFound) {
    const p = PROC_W / vw;
    const Hv = mul3([1 / p, 0, 0, 0, 1 / p, 0, 0, 0, 1], lastFound.hm);  /* reference photo -> full camera image */
    if (!drawOutline(o, Hv)) {
      const r = lastFound.radius / p * 1.35;
      o.strokeStyle = "#ee352e"; o.lineWidth = Math.max(6, r * .16);
      o.beginPath(); o.arc(lastFound.center.x / p, lastFound.center.y / p, r, 0, Math.PI * 2); o.stroke();
    }
  }
  unsnap();
  stopCamera();
  foundThisPhoto = found;
  $("shot").src = out.toDataURL("image/jpeg", .9);
  const badge = $("badge");
  badge.classList.toggle("found", found);
  badge.querySelector("svg").style.display = found ? "" : "none";
  $("badgeText").textContent = found ? "Found it" : "Photo taken";
  const accepted = found;
  $("next").style.display = accepted ? "" : "none";
  recordShot();
  if (accepted) state.found[state.i] = HUNT.stops[state.i].char;
  save();
  if (found && navigator.vibrate) navigator.vibrate([60, 40, 60]);
  showScreen("result");
}
$("retake").addEventListener("click", () => {
  state.found[state.i] = undefined;
  state.shots[state.i] = undefined; save();
  openCamera();
});
$("next").addEventListener("click", advance);

/* ---------- Start ---------- */
load();
initMap();
if (state.startedAt) { startTracking(); keepAwake(); }
if (state.found[state.i] && state.i < HUNT.stops.length) advance(); else render();
</script>
