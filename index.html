<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hunt camera</title>
<style>
  :root {
    --sign: #000; --ink: #fff; --muted: #a7a9ac; --signal: #ee352e; --go: #00933c;
    --panel: rgba(0,0,0,.72);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sign); color: var(--ink); overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }

  #intro.on { display: flex; }
  #intro {
    flex-direction: column; justify-content: center; max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top,0px) + 32px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);
  }
  .rule { height: 3px; background: var(--ink); margin-bottom: 18px; }
  h1 { font-size: clamp(2.4rem, 11vw, 3.6rem); font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; line-height: 1; }
  #intro p { font-size: 1.05rem; line-height: 1.45; color: var(--muted); margin: 0 0 12px; max-width: 34ch; }
  .btn {
    font: inherit; font-weight: 700; font-size: 1.05rem; border: 0; border-radius: 999px;
    padding: 15px 24px; cursor: pointer; background: var(--ink); color: var(--sign);
  }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
  .btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
  #start { align-self: flex-start; margin-top: 12px; }
  #loading { color: var(--muted); font-size: .95rem; margin-top: 14px; min-height: 1.4em; }
  .error { background: #3a0f0d; border-left: 4px solid var(--signal); padding: 12px 14px; margin-top: 16px; line-height: 1.45; display: none; }

  video, #live, #shot { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; background: #000; }
  #live { pointer-events: none; }
  #status {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top,0px) + 16px);
    background: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: .95rem; white-space: nowrap;
    display: flex; align-items: center; gap: 10px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; justify-content: center;
    padding: 16px 18px calc(env(safe-area-inset-bottom,0px) + 16px); background: var(--panel);
  }

  #shot { object-fit: contain; background: #000; }
  #badge {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top,0px) + 16px);
    display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 10px; border-radius: 999px;
    background: var(--go); font-weight: 700; font-size: 1.05rem;
  }
  #badge.manual { background: var(--panel); padding-left: 18px; }
  #badge svg { width: 28px; height: 28px; }
  #saveHint { position: absolute; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom,0px) + 90px);
    text-align: center; background: var(--panel); padding: 10px 14px; border-radius: 10px; display: none; line-height: 1.4; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>

<section id="intro" class="screen on">
  <div class="rule"></div>
  <h1 id="title">Stop 1</h1>
  <p>Point your camera at the place from your clue. When the page recognizes it, it takes the photo for you.</p>
  <p>Then tap Send photo and text it back.</p>
  <button id="start" class="btn">Open camera</button>
  <div id="loading" aria-live="polite"></div>
  <div id="error" class="error" role="alert"></div>
</section>

<section id="cam" class="screen" aria-label="Camera">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="live"></canvas>
  <div id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Looking for it</span></div>
  <div class="bar"><button id="manual" class="btn ghost">Take photo anyway</button></div>
</section>

<section id="result" class="screen" aria-label="Your photo">
  <img id="shot" alt="Your photo">
  <div id="badge"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#fff"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#00933c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="badgeText">Found it</span></div>
  <div id="saveHint">Press and hold the photo to save it, then text it back.</div>
  <div class="bar">
    <button id="retake" class="btn ghost">Retake</button>
    <button id="send" class="btn">Send photo</button>
  </div>
</section>

const MIN_INLIERS = 30;      /* matched points needed to count as found */
const STABLE_FRAMES = 3;     /* found this many checks in a row before capturing */
const PROC_W = 640;          /* width frames are analysed at */
const INTERVAL = 160;        /* ms between checks */

const code = new URLSearchParams(location.search).get("s");
const stop = STOPS[code];
const $ = (id) => document.getElementById(id);

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function showError(msg) { const e = $("error"); e.textContent = msg; e.style.display = "block"; }

if (!stop) {
  $("title").textContent = "Link not found";
  document.querySelectorAll("#intro p").forEach(p => p.remove());
  $("start").remove();
  showError("This link doesn't open a stop. Use the exact link from your clue.");
} else {
  $("title").textContent = stop.title;
  document.title = stop.title;
}

/* ---------- OpenCV loading ---------- */
let cvReady = null;
function loadCv() {
  if (cvReady) return cvReady;
  cvReady = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://docs.opencv.org/4.10.0/opencv.js";
    s.async = true;
    s.onerror = () => reject(new Error("load"));
    s.onload = () => {
      const c = window.cv;
      if (c && typeof c.then === "function") c.then(m => { window.cv = m; resolve(); });
      else if (c && c.Mat) resolve();
      else if (c) c.onRuntimeInitialized = () => resolve();
      else reject(new Error("load"));
    };
    document.head.appendChild(s);
  });
  return cvReady;
}

/* ---------- Reference ---------- */
let orb, matcher, refKp, refDes;
async function prepareRef() {
  const img = new Image();
  img.src = stop.ref;
  await img.decode();
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d").drawImage(img, 0, 0);
  stop.refW = c.width; stop.refH = c.height;
  const src = cv.imread(c);
  const gray = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  orb = new cv.ORB(1000);
  matcher = new cv.BFMatcher(cv.NORM_HAMMING, false);
  refKp = new cv.KeyPointVector();
  refDes = new cv.Mat();
  const none = new cv.Mat();
  orb.detectAndCompute(gray, none, refKp, refDes);
  src.delete(); gray.delete(); none.delete();
}

/* ---------- Camera ---------- */
const video = $("video");
const live = $("live");
const lctx = live.getContext("2d");
const proc = document.createElement("canvas");
const pctx = proc.getContext("2d", { willReadFrequently: true });
let stream = null, running = false, stable = 0, lastFound = null, timer = null, shotFile = null;

$("start")?.addEventListener("click", async () => {
  $("error").style.display = "none";
  if (!navigator.mediaDevices?.getUserMedia) {
    showError("This browser can't open the camera here. Open the link directly in Safari (iPhone) or Chrome (Android).");
    return;
  }
  $("start").disabled = true;
  $("loading").textContent = "Getting ready…";
  const cvP = loadCv();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
    });
  } catch (e) {
    $("start").disabled = false; $("loading").textContent = "";
    showError(e?.name === "NotAllowedError"
      ? "Camera access is blocked. Allow camera access for this page in your browser settings, then reload."
      : "The camera didn't start. Open the link directly in Safari or Chrome and try again.");
    return;
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  show("cam");
  setStatus("Loading the guide…");
  try {
    await cvP;
    await prepareRef();
  } catch (e) {
    setStatus("Couldn't load the guide. Use Take photo anyway.");
    return;
  }
  setStatus("Looking for it");
  startLoop();
});

function setStatus(t) { $("statusText").textContent = t; }

function startLoop() {
  running = true; stable = 0;
  const tick = () => {
    if (!running) return;
    try { analyse(); } catch (e) { /* skip this frame */ }
    timer = setTimeout(tick, INTERVAL);
  };
  tick();
}
function stopLoop() { running = false; clearTimeout(timer); }

/* Map a point in video pixels to screen pixels (video uses object-fit: cover). */
function coverMap() {
  const W = live.clientWidth, H = live.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  return { s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
}

function analyse() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const p = PROC_W / vw;
  proc.width = PROC_W; proc.height = Math.round(vh * p);
  pctx.drawImage(video, 0, 0, proc.width, proc.height);

  const dpr = window.devicePixelRatio || 1;
  if (live.width !== live.clientWidth * dpr) { live.width = live.clientWidth * dpr; live.height = live.clientHeight * dpr; }
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lctx.clearRect(0, 0, live.clientWidth, live.clientHeight);

  const result = detect(proc, p);
  if (result) {
    stable++;
    lastFound = result;
    const m = coverMap();
    const toScreen = (pt) => [pt.x / p * m.s + m.ox, pt.y / p * m.s + m.oy];
    lctx.strokeStyle = "#00c853"; lctx.lineWidth = 4; lctx.lineJoin = "round";
    lctx.beginPath();
    result.quad.forEach((pt, i) => { const [x, y] = toScreen(pt); i ? lctx.lineTo(x, y) : lctx.moveTo(x, y); });
    lctx.closePath(); lctx.stroke();
    setStatus("Hold still…");
    if (stable >= STABLE_FRAMES) capture(true);
  } else {
    stable = 0;
    setStatus("Looking for it");
  }
}

function detect(canvas, p) {
  const mats = [];
  const keep = (m) => (mats.push(m), m);
  try {
    const src = keep(cv.imread(canvas));
    const gray = keep(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const kp = keep(new cv.KeyPointVector());
    const des = keep(new cv.Mat());
    const none = keep(new cv.Mat());
    orb.detectAndCompute(gray, none, kp, des);
    if (des.rows < MIN_INLIERS) return null;

    const knn = keep(new cv.DMatchVectorVector());
    matcher.knnMatch(refDes, des, knn, 2);
    const a = [], b = [];
    for (let i = 0; i < knn.size(); i++) {
      const pair = knn.get(i);
      if (pair.size() >= 2) {
        const m1 = pair.get(0), m2 = pair.get(1);
        if (m1.distance < 0.75 * m2.distance) {
          const r = refKp.get(m1.queryIdx).pt, f = kp.get(m1.trainIdx).pt;
          a.push(r.x, r.y); b.push(f.x, f.y);
        }
      }
      pair.delete();
    }
    if (a.length / 2 < MIN_INLIERS) return null;

    const srcPts = keep(cv.matFromArray(a.length / 2, 1, cv.CV_32FC2, a));
    const dstPts = keep(cv.matFromArray(b.length / 2, 1, cv.CV_32FC2, b));
    const mask = keep(new cv.Mat());
    const H = keep(cv.findHomography(srcPts, dstPts, cv.RANSAC, 5, mask));
    if (H.empty()) return null;
    if (cv.countNonZero(mask) < MIN_INLIERS) return null;

    const w = stop.refW, h = stop.refH, c = stop.circle;
    const pts = [0, 0, w, 0, w, h, 0, h, c.x, c.y, c.x + c.r, c.y];
    const inM = keep(cv.matFromArray(6, 1, cv.CV_32FC2, pts));
    const outM = keep(new cv.Mat());
    cv.perspectiveTransform(inM, outM, H);
    const o = outM.data32F;
    const P = (i) => ({ x: o[i * 2], y: o[i * 2 + 1] });
    const quad = [P(0), P(1), P(2), P(3)];
    const center = P(4), edge = P(5);

    if (!isConvex(quad)) return null;
    const area = polyArea(quad);
    if (area < canvas.width * canvas.height * 0.03) return null;

    if (stop.color) {
      const x = Math.round(center.x), y = Math.round(center.y);
      if (x < 3 || y < 3 || x > canvas.width - 4 || y > canvas.height - 4) return null;
      const d = pctx.getImageData(x - 3, y - 3, 7, 7).data;
      let R = 0, G = 0, B = 0, n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; }
      if (!stop.color(R / n, G / n, B / n)) {
        /* the answer's centre may sit on the character itself; sample a ring instead */
        const rr = Math.hypot(edge.x - center.x, edge.y - center.y) * 0.75;
        let ok = 0;
        for (let k = 0; k < 8; k++) {
          const ang = k * Math.PI / 4;
          const sx = Math.round(center.x + rr * Math.cos(ang)), sy = Math.round(center.y + rr * Math.sin(ang));
          if (sx < 0 || sy < 0 || sx >= canvas.width || sy >= canvas.height) continue;
          const q = pctx.getImageData(sx, sy, 1, 1).data;
          if (stop.color(q[0], q[1], q[2])) ok++;
        }
        if (ok < 4) return null;
      }
    }
    return { quad, center, radius: Math.hypot(edge.x - center.x, edge.y - center.y) };
  } finally {
    mats.forEach(m => { try { m.delete(); } catch (e) {} });
  }
}

function isConvex(q) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
    const z = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
    if (z === 0) return false;
    if (!sign) sign = Math.sign(z); else if (Math.sign(z) !== sign) return false;
  }
  return true;
}
function polyArea(q) {
  let s = 0;
  for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4]; s += a.x * b.y - b.x * a.y; }
  return Math.abs(s) / 2;
}

/* ---------- Capture and share ---------- */
function capture(found) {
  stopLoop();
  const vw = video.videoWidth, vh = video.videoHeight;
  const out = document.createElement("canvas");
  out.width = vw; out.height = vh;
  const o = out.getContext("2d");
  o.drawImage(video, 0, 0, vw, vh);
  if (found && lastFound) {
    const p = PROC_W / vw;
    const cx = lastFound.center.x / p, cy = lastFound.center.y / p;
    const r = lastFound.radius / p * 1.35;
    o.strokeStyle = "#ee352e";
    o.lineWidth = Math.max(6, r * 0.16);
    o.beginPath(); o.arc(cx, cy, r, 0, Math.PI * 2); o.stroke();
  }
  const url = out.toDataURL("image/jpeg", 0.9);
  $("shot").src = url;
  $("badge").classList.toggle("manual", !found);
  $("badge").querySelector("svg").style.display = found ? "" : "none";
  $("badgeText").textContent = found ? "Found it" : "Photo taken";
  $("saveHint").style.display = "none";
  shotFile = null;
  out.toBlob((blob) => {
    if (blob) shotFile = new File([blob], (stop.title || "photo").replace(/\s+/g, "-").toLowerCase() + ".jpg", { type: "image/jpeg" });
  }, "image/jpeg", 0.9);
  if (navigator.vibrate) navigator.vibrate(found ? [60, 40, 60] : 40);
  show("result");
}

$("manual").addEventListener("click", () => capture(false));

$("retake").addEventListener("click", () => {
  lastFound = null;
  show("cam");
  if (orb) { setStatus("Looking for it"); startLoop(); }
});

$("send").addEventListener("click", () => {
  if (shotFile && navigator.canShare && navigator.canShare({ files: [shotFile] })) {
    navigator.share({ files: [shotFile] }).catch(() => {});
  } else {
    $("saveHint").style.display = "block";
  }
});
</script>
